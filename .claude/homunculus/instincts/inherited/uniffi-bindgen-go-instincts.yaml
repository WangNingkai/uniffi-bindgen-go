# Uniffi Bindgen Go Workflow Upgrade Uniffi And Dependencies

## Action

Follow the upgrade-uniffi-and-dependencies workflow:
1. Update version numbers in Cargo.toml and bindgen/Cargo.toml (and sometimes fixtures/Cargo.toml).
2. Update Cargo.lock.
3. Adapt Rust source files in bindgen/src/gen_go/ (multiple .rs files) to new uniffi APIs.
4. Update Go template files in bindgen/templates/ to match new FFI conventions.
5. Update or add tests in binding_tests/ and fixtures/ as needed.
6. Update README.md and CHANGELOG.md with release notes.
7. Update rust-toolchain.toml if MSRV changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: Cargo.toml, bindgen/Cargo.toml, fixtures/Cargo.toml

